name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --python 3.13
      - name: Run tests
        run: uv run --frozen python -m pytest -q

  # Les adaptateurs de Bob face aux vrais services, aux versions de docker-compose.yml
  services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --python 3.13
      - name: Start Remy and Emile at the versions of docker-compose.yml
        run: |
          image() { uv run --frozen python -c "import sys, yaml; print(yaml.safe_load(open('docker-compose.yml'))['services'][sys.argv[1]]['image'])" "$1"; }
          docker run -d --name remy -p 18001:8000 "$(image remy)"
          docker run -d --name emile -p 18002:8000 "$(image emile)"
          for port in 18001 18002; do
            timeout 90 sh -c "until curl -fs http://127.0.0.1:$port/health >/dev/null; do sleep 2; done"
          done
      # Dora n'a pas d'image publiée : construite depuis le tag de docker-compose.yml. Sans BRouter (1,5 Go de tuiles) :
      # on vérifie le contrat (santé, validation, « BRouter injoignable ») ; le tracé est testé dans le dépôt de Dora.
      - name: Start Dora at the version of docker-compose.yml, without BRouter
        run: |
          build=$(uv run --frozen python -c "import yaml; print(yaml.safe_load(open('docker-compose.yml'))['services']['dora']['build'])")
          docker build -q -t dora-ci "$build"
          docker run -d --name dora -p 18003:8000 -e BROUTER_URL=http://127.0.0.1:9/brouter dora-ci
          timeout 90 sh -c 'until curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:18003/health | grep -qE "200|503"; do sleep 2; done'
          echo "DORA_URL=http://127.0.0.1:18003" >> "$GITHUB_ENV"
      - name: Create Bob's accounts and API keys
        run: |
          remy_key=$(docker exec remy remy user create athlete --timezone Europe/Paris --lang fr --label bob \
            | sed -n 's/^API key (shown once): //p')
          emile_key=$(docker exec emile emile setup bob --household Home --timezone Europe/Paris --language fr --boxes 3 \
            | tail -n 1)
          test -n "$remy_key" && test -n "$emile_key"
          echo "::add-mask::$remy_key"; echo "::add-mask::$emile_key"
          { echo "REMY_URL=http://127.0.0.1:18001"; echo "REMY_API_KEY=$remy_key"
            echo "EMILE_URL=http://127.0.0.1:18002"; echo "EMILE_API_KEY=$emile_key"; } >> "$GITHUB_ENV"
      - name: Run the live service tests
        run: BOB_LIVE_SERVICES=1 uv run --frozen python -m pytest -q tests/test_services_live.py
      - name: Service logs
        if: failure()
        run: docker logs remy; docker logs emile; docker logs dora
