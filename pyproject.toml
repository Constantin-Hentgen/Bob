[project]
name = "bob"
version = "6.0.0"
description = "Bob, a self-hosted AI running coach on Telegram"
license = "MIT"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-telegram-bot>=21.0",
    "caldav>=1.3.0",
    "icalendar>=6.0",
    "apscheduler>=3.10.4,<4",
    "anthropic>=0.40.0",
    "httpx>=0.27",
    "requests>=2.31.0",
    "tzdata",
    "mcp>=2.0",
    "faster-whisper>=1.1",
    "av>=11,<19",
    "remy[client]",
    "emile[client]",
    "dora-routes",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6.0.3",
    "remy[server]>=0.6.0",
    "emile[service]>=0.6.0",
]

[tool.uv]
package = false

[tool.uv.sources]
remy = { url = "https://github.com/Constantin-Hentgen/Remy/archive/refs/tags/v0.6.0.tar.gz" }
emile = { url = "https://github.com/Constantin-Hentgen/Emile/archive/refs/tags/v0.6.0.tar.gz" }
dora-routes = { url = "https://github.com/Constantin-Hentgen/Dora/archive/refs/tags/v0.6.0.tar.gz" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: talks to the real Remy, Emile and Dora started by the CI job (BOB_LIVE_SERVICES=1)"]
