services:
  bob:
    build: .
    container_name: bob
    restart: unless-stopped
    # Configuration : chaque variable est lue par interpolation ${VAR}, ce qui marche partout :
    # - docker compose en local : lues dans le fichier .env à côté de ce fichier ;
    # - Portainer (stack depuis un dépôt Git) : variables saisies dans l'UI du stack.
    # Une variable absente arrive vide et prend la valeur par défaut du code (voir .env.example).
    # Les lignes parasites (vides, commentaires) de l'UI Portainer sont ignorées.
    environment:
      # Modèle de langage (Anthropic ou toute API compatible OpenAI)
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_PLANNING_MODEL: ${LLM_PLANNING_MODEL:-}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-}
      LLM_MAX_TOOL_ROUNDS: ${LLM_MAX_TOOL_ROUNDS:-}
      # anciens noms, encore acceptés
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
      CLAUDE_PLANNING_MODEL: ${CLAUDE_PLANNING_MODEL:-}
      CLAUDE_MAX_TOKENS: ${CLAUDE_MAX_TOKENS:-}
      CLAUDE_MAX_TOOL_ROUNDS: ${CLAUDE_MAX_TOOL_ROUNDS:-}
      # Telegram
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # Agenda CalDAV (Radicale, Nextcloud, Baïkal, Fastmail, iCloud…)
      CALDAV_URL: ${CALDAV_URL:-}
      CALDAV_USER: ${CALDAV_USER:-}
      CALDAV_PASS: ${CALDAV_PASS:-}
      # anciens noms, encore acceptés
      RADICALE_URL: ${RADICALE_URL:-}
      RADICALE_USER: ${RADICALE_USER:-}
      RADICALE_PASS: ${RADICALE_PASS:-}
      # Dreeve
      DREEVE_URL: ${DREEVE_URL:-}
      DREEVE_API_URL: ${DREEVE_API_URL:-}
      DREEVE_API_KEY: ${DREEVE_API_KEY:-}
      DREEVE_MCP_KEY: ${DREEVE_MCP_KEY:-}
      DREEVE_MCP_URL: ${DREEVE_MCP_URL:-}
      DREEVE_RUN_TYPES: ${DREEVE_RUN_TYPES:-}
      # GIF
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}
      # Météo
      WEATHER_LOCATIONS: ${WEATHER_LOCATIONS:-}
      WEATHER_LAT: ${WEATHER_LAT:-}
      WEATHER_LON: ${WEATHER_LON:-}
      WEATHER_API_URL: ${WEATHER_API_URL:-}
      # Alertes météo
      RAIN_ALERT_CHECK_MINUTES: ${RAIN_ALERT_CHECK_MINUTES:-}
      RAIN_ALERT_HOURS_AHEAD: ${RAIN_ALERT_HOURS_AHEAD:-}
      RAIN_ALERT_PROBABILITY: ${RAIN_ALERT_PROBABILITY:-}
      RAIN_ALERT_MIN_MM: ${RAIN_ALERT_MIN_MM:-}
      RAIN_ALERT_SKIP_KEYWORDS: ${RAIN_ALERT_SKIP_KEYWORDS:-}
      WEATHER_ALERT_HEAT_C: ${WEATHER_ALERT_HEAT_C:-}
      WEATHER_ALERT_GUST_KMH: ${WEATHER_ALERT_GUST_KMH:-}
      WEATHER_ALERT_FREEZE_C: ${WEATHER_ALERT_FREEZE_C:-}
      # Coach
      BOT_LANGUAGE: ${BOT_LANGUAGE:-}
      COACH_TZ: ${COACH_TZ:-}
      BRIEFING_TIME: ${BRIEFING_TIME:-}
      WEEKLY_REVIEW_TIME: ${WEEKLY_REVIEW_TIME:-}
      PANTRY_CHECK_TIME: ${PANTRY_CHECK_TIME:-}
      MEAL_CHECK_TIMES: ${MEAL_CHECK_TIMES:-}
      EAT_SUGGEST_TIMES: ${EAT_SUGGEST_TIMES:-}
      SHOP_LAST_CALL: ${SHOP_LAST_CALL:-}
      NEW_DISH_TIME: ${NEW_DISH_TIME:-}
      NUTRITION_CHECK_TIME: ${NUTRITION_CHECK_TIME:-}
      WHISPER_MODEL: ${WHISPER_MODEL:-}
      ACTIVITY_POLL_MINUTES: ${ACTIVITY_POLL_MINUTES:-}
      PLANNING_HORIZON_DAYS: ${PLANNING_HORIZON_DAYS:-}
      CALENDAR_CONTEXT_DAYS: ${CALENDAR_CONTEXT_DAYS:-}
      HISTORY_MESSAGES: ${HISTORY_MESSAGES:-}
      COACH_SEED_MEMORY: ${COACH_SEED_MEMORY:-}
      # Services voisins, dans ce même stack (voir le wiki « Services ») : seule la clé d'API est à saisir
      REMY_URL: ${REMY_URL:-}
      REMY_API_KEY: ${REMY_API_KEY:-}
      EMILE_URL: ${EMILE_URL:-}
      DORA_URL: ${DORA_URL:-}
      EMILE_API_KEY: ${EMILE_API_KEY:-}
      # Technique
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      COACH_DATA_DIR: /data
      TZ: ${COACH_TZ:-Europe/Paris}
    # LLM_PROVIDER=ollama : le serveur Ollama de l'hôte est joignable sur host.docker.internal (aussi sous Linux)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${COACH_PORT:-18000}:8000"
    volumes:
      - coach-data:/data
    depends_on:
      - remy
      - emile
      - dora

  # Nutrition : journal des repas, profil, besoins, bilans (https://github.com/Constantin-Hentgen/Remy).
  # Aucun port publié : seul Bob lui parle, sur le réseau du stack (http://remy:8000).
  remy:
    image: ghcr.io/constantin-hentgen/remy:0.6.0   # même version que le client dans pyproject.toml
    container_name: remy
    restart: unless-stopped
    environment:
      REMY_ADMIN_KEY: ${REMY_ADMIN_KEY:-}
      LOG_LEVEL: ${REMY_LOG_LEVEL:-}
      TZ: ${COACH_TZ:-Europe/Paris}
    volumes:
      - remy-data:/data

  # Courses : liste, stock, boîtes, recettes, agenda courses (https://github.com/Constantin-Hentgen/Emile).
  emile:
    image: ghcr.io/constantin-hentgen/emile:0.6.0   # même version que le client dans pyproject.toml
    container_name: emile
    restart: unless-stopped
    environment:
      EMILE_SECRET_KEY: ${EMILE_SECRET_KEY:-}   # chiffre les identifiants de l'agenda courses
      EMILE_DEFAULT_TIMEZONE: ${COACH_TZ:-Europe/Paris}
      TZ: ${COACH_TZ:-Europe/Paris}
    volumes:
      - emile-data:/data

  # Boucles de course : tracé, « jamais faite », carte et GPX (https://github.com/Constantin-Hentgen/Dora).
  # Pas d'image publiée : construit depuis le tag Git (même version que le client dans pyproject.toml).
  # Premier démarrage : `segments` télécharge les tuiles BRouter (~1,5 Go pour la France), puis `brouter`, puis `dora`.
  # Disque : ~2 Go ; mémoire : ~1,5 Go de plus. Données cartographiques à rafraîchir chaque mois : recréer `segments`
  # puis redémarrer `brouter` (wiki de Dora, « Self-hosting »).
  dora: &dora
    build: https://github.com/Constantin-Hentgen/Dora.git#v0.6.0
    image: dora:0.6.0
    pull_policy: build   # image construite, jamais tirée : « re-pull » de Portainer ne doit pas la chercher en ligne
    container_name: dora
    restart: unless-stopped
    environment:
      BROUTER_URL: http://brouter:17777/brouter
      LOG_LEVEL: ${DORA_LOG_LEVEL:-INFO}
    depends_on:
      - brouter

  brouter:
    build:
      context: https://github.com/Constantin-Hentgen/Dora.git#v0.6.0
      dockerfile: brouter.Dockerfile
      args:
        BROUTER_IMAGE: ghcr.io/abrensch/brouter@sha256:fbc2a0e47e655fb20ab0005c9f5fbc60e6e45e0997092713c1b996bc7cf01711
    image: dora-brouter:0.6.0
    pull_policy: build
    container_name: brouter
    restart: unless-stopped
    environment:
      MAXTHREADS: "4"
      JAVA_OPTS: -Xmx1024M -Xms128M -Xmn8M -DmaxRunningTime=60 -DuseRFCMimeType=false -DusePOSTRequests=false
    volumes:
      - dora-segments:/segments4:ro
    depends_on:
      segments:
        condition: service_completed_successfully

  segments:   # une fois : télécharge les tuiles BRouter, puis s'arrête
    <<: *dora
    container_name: dora-segments
    command: ["dora-segments", "--ok-if-present"]
    restart: "no"
    depends_on: []
    volumes:
      - dora-segments:/segments4
    environment:
      SEGMENTS_BBOX: ${SEGMENTS_BBOX:--4.8,41.3,9.6,51.1}

volumes:
  coach-data:
  remy-data:
  emile-data:
  dora-segments:
